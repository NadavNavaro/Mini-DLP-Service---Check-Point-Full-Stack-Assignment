# Run one backend and one persistent PostgreSQL database; publish only the backend on localhost.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dlp
      POSTGRES_USER: dlp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dlp-local-password}
    volumes:
      - dlp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlp -d dlp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/dlp
      DB_USER: dlp
      DB_PASSWORD: ${DB_PASSWORD:-dlp-local-password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  dlp-data:
